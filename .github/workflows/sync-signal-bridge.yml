name: Sync Signal Bridge Image to Aliyun ACR

on:
  workflow_dispatch:

jobs:
  sync-signal:
    runs-on: ubuntu-latest
    steps:
      # 1. 登录阿里云 ACR（推送目标需要认证）
      - name: Login to Aliyun ACR
        uses: docker/login-action@v4
        with:
          registry: crpi-cir91a122bvjkhqh.cn-shanghai.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      # 2. 拉取公共 Signal Bridge 镜像，打标签并推送到阿里云 ACR
      - name: Pull, tag and push Signal Bridge image
        run: |
          SOURCE_IMAGE="dock.mau.dev/mautrix/signal:latest"
          TARGET_IMAGE="crpi-cir91a122bvjkhqh.cn-shanghai.personal.cr.aliyuncs.com/${{ secrets.ALIYUN_NAMESPACE }}/signal-bridge:latest"
          docker pull $SOURCE_IMAGE
          docker tag $SOURCE_IMAGE $TARGET_IMAGE
          docker push $TARGET_IMAGE
