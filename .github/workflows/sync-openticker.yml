name: Sync OpenTicker Image to Aliyun ACR

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OpenTicker
        uses: actions/checkout@v5
        with:
          repository: Aether-Grid/openticker
          ref: main
          fetch-depth: 0

      - name: Remove private submodule and add empty indicators feature
        run: |
          sed -i '/"crates\/openticker-indicators"/d' Cargo.toml
          sed -i '/openticker-indicators/d' crates/openticker-registry/Cargo.toml
          sed -i '/use openticker_indicators::/d' crates/openticker-registry/src/lib.rs
          sed -i '/descriptors\.extend(openticker_indicators::indicator_descriptors())/d' crates/openticker-registry/src/lib.rs
          if grep -q '\[features\]' crates/openticker-registry/Cargo.toml; then
            sed -i '/\[features\]/a indicators = []' crates/openticker-registry/Cargo.toml
          else
            printf '\n[features]\nindicators = []\n' >> crates/openticker-registry/Cargo.toml
          fi

      - name: Create complete Dockerfile (Nuxt + Rust multi-stage)
        run: |
          cat > Dockerfile << 'DOCKER_EOF'
          # Stage 1: Build Nuxt frontend
          FROM node:22-alpine AS ui-builder
          WORKDIR /build/ui
          COPY crates/openticker-http/ui .
          RUN corepack enable && corepack prepare pnpm@latest --activate && pnpm install && pnpm build

          # Stage 2: Build Rust backend
          FROM rust:1.75-slim-bookworm AS builder
          WORKDIR /usr/src/openticker
          RUN apt-get update && apt-get install -y --no-install-recommends \
              pkg-config libssl-dev libsqlite3-dev ca-certificates \
              && rm -rf /var/lib/apt/lists/*
          COPY . .
          COPY --from=ui-builder /build/ui/.output crates/openticker-http/ui/.output
          RUN cargo build --release -p openticker-cli --no-default-features

          # Stage 3: Runtime image
          FROM debian:bookworm-slim
          WORKDIR /app
          RUN apt-get update && apt-get install -y --no-install-recommends \
              ca-certificates libssl3 libsqlite3-0 \
              && rm -rf /var/lib/apt/lists/*
          COPY --from=builder /usr/src/openticker/target/release/openticker-cli /app/openticker-cli
          CMD ["/app/openticker-cli"]
          DOCKER_EOF

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Aliyun ACR
        uses: docker/login-action@v4
        with:
          registry: crpi-cir91a122bvjkhqh.cn-shanghai.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      # 关键修复：设置 Docker Buildx 以支持缓存导出
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push OpenTicker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: crpi-cir91a122bvjkhqh.cn-shanghai.personal.cr.aliyuncs.com/${{ secrets.ALIYUN_NAMESPACE }}/openticker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
