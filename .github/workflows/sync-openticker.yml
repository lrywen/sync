name: Sync OpenTicker Image to Aliyun ACR

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取主仓库代码（不拉子模块）
      - name: Checkout OpenTicker
        uses: actions/checkout@v4
        with:
          repository: Aether-Grid/openticker
          ref: main
          fetch-depth: 0

      # 2. 关键：修改 Dockerfile，删除子模块相关命令
      - name: Remove submodule commands from Dockerfile
        run: |
          # 删除所有包含 "git submodule" 的行
          sed -i '/git submodule sync --recursive/d' Dockerfile
          sed -i '/git submodule update --init --recursive/d' Dockerfile

      # 3. 登录阿里云ACR
      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: crpi-cir91a122bvjkhqh.cn-shanghai.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      # 4. 构建并推送到ACR
      - name: Build and push OpenTicker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: crpi-cir91a122bvjkhqh.cn-shanghai.personal.cr.aliyuncs.com/lrywen/openticker:latest
