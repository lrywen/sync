name: Sync OpenTicker Image to Aliyun ACR

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取主仓库代码（不拉子模块）
      - name: Checkout OpenTicker
        uses: actions/checkout@v4
        with:
          repository: Aether-Grid/openticker
          ref: main
          fetch-depth: 0

      # 2. 【新增并完善】彻底移除对私有子模块的引用
      - name: Remove private submodule from source code
        run: |
          # 从根 Cargo.toml 中删除 workspace members 里的引用
          sed -i '/"crates\/openticker-indicators"/d' Cargo.toml
          # 从 openticker-registry 的 Cargo.toml 中删除所有相关行
          sed -i '/openticker-indicators/d' crates/openticker-registry/Cargo.toml
          # 从 openticker-registry 的源码中，删除对私有模块的导入和调用
          sed -i '/use openticker_indicators::/d' crates/openticker-registry/src/lib.rs
          sed -i '/descriptors\.extend(openticker_indicators::indicator_descriptors())/d' crates/openticker-registry/src/lib.rs

      # 3. 关键：创建一个指定构建参数的全新 Dockerfile
      - name: Create clean Dockerfile
        run: |
          cat > Dockerfile << 'EOF'
          FROM rust:1.75-slim-bookworm AS builder
          WORKDIR /usr/src/openticker
          RUN apt-get update && apt-get install -y --no-install-recommends \
              pkg-config libssl-dev libsqlite3-dev ca-certificates \
              && rm -rf /var/lib/apt/lists/*
          COPY . .
          # 核心修复：明确排除 indicators 特性，跳过相关代码
          RUN cargo build --release -p openticker-cli --no-default-features

          FROM debian:bookworm-slim
          WORKDIR /app
          RUN apt-get update && apt-get install -y --no-install-recommends \
              ca-certificates libssl3 libsqlite3-0 \
              && rm -rf /var/lib/apt/lists/*
          COPY --from=builder /usr/src/openticker/target/release/openticker-cli /app/openticker-cli
          CMD ["/app/openticker-cli"]
          EOF

      # 4. 登录阿里云ACR
      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: crpi-cir91a122bvjkhqh.cn-shanghai.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      # 5. 构建并推送到ACR
      - name: Build and push OpenTicker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: crpi-cir91a122bvjkhqh.cn-shanghai.personal.cr.aliyuncs.com/lrywen/openticker:latest
