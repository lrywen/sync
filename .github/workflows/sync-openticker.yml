name: Sync OpenTicker Image to Aliyun ACR

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1. 仅拉取主仓库代码，跳过子模块
      - name: Checkout OpenTicker
        uses: actions/checkout@v4
        with:
          repository: Aether-Grid/openticker
          ref: main
          fetch-depth: 0
          # 移除 submodules: 'recursive'，避免拉取不存在的子模块

      # 2. 登录阿里云ACR（复用你已有的Secrets）
      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: crpi-cir91a122bvjkhqh.cn-shanghai.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      # 3. 构建并推送到阿里云ACR（保持不变）
      - name: Build and push OpenTicker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: crpi-cir91a122bvjkhqh.cn-shanghai.personal.cr.aliyuncs.com/lrywen/openticker:latest
