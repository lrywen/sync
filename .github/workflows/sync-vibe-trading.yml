name: Build & Sync Vibe-Trading (Full) to Aliyun ACR

on:
  workflow_dispatch:

jobs:
  build-vibe-trading:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Full Source
        uses: actions/checkout@v4
        with:
          repository: HKUDS/Vibe-Trading
          fetch-depth: 0

      - name: Create Production Dockerfile (Ensuring all backend dirs)
        run: |
          cat > Dockerfile << 'EOF'
          # ---------- 前端构建阶段 ----------
          FROM node:20-alpine AS frontend-builder
          WORKDIR /build/frontend
          COPY frontend/ .
          RUN if [ -f package.json ]; then npm ci && npm run build; fi

          # ---------- 最终运行阶段 ----------
          FROM python:3.11-slim

          # 安装系统依赖
          RUN apt-get update && apt-get install -y --no-install-recommends \
              gcc g++ git curl \
              && rm -rf /var/lib/apt/lists/*

          WORKDIR /app

          # 复制后端依赖文件并安装
          COPY agent/requirements.txt .
          RUN pip install --no-cache-dir -r requirements.txt

          # 复制整个后端 agent 目录（包含 auth, db/migrations 等所有子目录）
          COPY agent/ ./agent/

          # 复制前端构建产物（如果存在）
          COPY --from=frontend-builder /build/frontend/dist/ ./frontend/dist/

          # 环境变量
          ENV PYTHONPATH=/app/agent
          ENV PORT=8000

          EXPOSE $PORT

          # 启动命令（根据项目实际入口调整，常见为 main.py 或 uvicorn）
          CMD ["uvicorn", "agent.main:app", "--host", "0.0.0.0", "--port", "8000"]
          EOF

      - name: Login to Aliyun ACR
        uses: docker/login-action@v4
        with:
          registry: crpi-cir91a122bvjkhqh.cn-shanghai.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Vibe-Trading image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            crpi-cir91a122bvjkhqh.cn-shanghai.personal.cr.aliyuncs.com/${{ secrets.ALIYUN_NAMESPACE }}/vibe-trading:latest
            crpi-cir91a122bvjkhqh.cn-shanghai.personal.cr.aliyuncs.com/${{ secrets.ALIYUN_NAMESPACE }}/vibe-trading:${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
