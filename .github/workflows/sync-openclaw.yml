name: Sync OpenClaw Image to Aliyun ACR

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Login to Aliyun ACR
        uses: docker/login-action@v4
        with:
          registry: crpi-cir91a122bvjkhqh.cn-shanghai.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Pull latest OpenClaw image and extract real version
        run: |
          # 拉取最新的镜像（使用 latest 标签）
          SOURCE_IMAGE="ghcr.io/openclaw/openclaw:latest"
          docker pull --platform linux/amd64 $SOURCE_IMAGE
          
          # 从镜像的 RepoTags 中提取真实的版本号（例如 ghcr.io/openclaw/openclaw:2026.5.19）
          FULL_TAG=$(docker image inspect $SOURCE_IMAGE --format='{{index .RepoTags 0}}')
          REAL_VERSION=$(echo $FULL_TAG | sed 's/.*://')
          echo "Detected real version: $REAL_VERSION"
          
          # 设置目标镜像名称（阿里云 ACR）
          TARGET_LATEST="crpi-cir91a122bvjkhqh.cn-shanghai.personal.cr.aliyuncs.com/${{ secrets.ALIYUN_NAMESPACE }}/openclaw:latest"
          TARGET_VERSIONED="crpi-cir91a122bvjkhqh.cn-shanghai.personal.cr.aliyuncs.com/${{ secrets.ALIYUN_NAMESPACE }}/openclaw:${REAL_VERSION}"
          
          # 打标签并推送
          docker tag $SOURCE_IMAGE $TARGET_LATEST
          docker tag $SOURCE_IMAGE $TARGET_VERSIONED
          docker push $TARGET_LATEST
          docker push $TARGET_VERSIONED
