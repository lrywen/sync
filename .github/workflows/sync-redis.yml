name: Sync Redis Official Image to Aliyun ACR

on:
  workflow_dispatch:

jobs:
  sync-redis:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Aliyun ACR
        uses: docker/login-action@v4
        with:
          registry: crpi-cir91a122bvjkhqh.cn-shanghai.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Pull, tag and push Redis images (latest & alpine)
        run: |
          REGISTRY="crpi-cir91a122bvjkhqh.cn-shanghai.personal.cr.aliyuncs.com/${{ secrets.ALIYUN_NAMESPACE }}"
          
          # 同步 latest 版本
          docker pull redis:latest
          docker tag redis:latest $REGISTRY/redis:latest
          docker push $REGISTRY/redis:latest
          
          # 同步 alpine 版本
          docker pull redis:alpine
          docker tag redis:alpine $REGISTRY/redis:alpine
          docker push $REGISTRY/redis:alpine
