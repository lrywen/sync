name: Sync Obsidian Image to Aliyun ACR

on:
  workflow_dispatch:

jobs:
  sync-obsidian:
    runs-on: ubuntu-latest
    steps:
      # 如果不需要额外登录 Docker Hub，可以省略登录步骤

      - name: Login to Aliyun ACR
        uses: docker/login-action@v4
        with:
          registry: crpi-cir91a122bvjkhqh.cn-shanghai.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Pull, Tag, and Push Obsidian Image
        run: |
          SOURCE_IMAGE="ghcr.io/linuxserver/obsidian:latest"
          TARGET_IMAGE="crpi-cir91a122bvjkhqh.cn-shanghai.personal.cr.aliyuncs.com/${{ secrets.ALIYUN_NAMESPACE }}/obsidian:latest"
          docker pull $SOURCE_IMAGE
          docker tag $SOURCE_IMAGE $TARGET_IMAGE
          docker push $TARGET_IMAGE
