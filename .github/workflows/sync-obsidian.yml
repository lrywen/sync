name: Sync Obsidian Remote Image to Aliyun ACR

on:
  workflow_dispatch:
    inputs:
      obsidian_version:
        description: 'Obsidian version (e.g., 1.12.7, latest)'
        required: false
        default: 'latest'
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Clone sytone/obsidian-remote
        run: |
          git clone https://github.com/sytone/obsidian-remote.git
          cd obsidian-remote
          git checkout main

      - name: Create Dockerfile (KasmVNC + Obsidian)
        working-directory: obsidian-remote
        run: |
          cat > Dockerfile << 'DOCKER_EOF'
          # ---------- Stage 1: Base KasmVNC with Obsidian ----------
          FROM kasmweb/desktop:1.16.0 AS builder

          USER root

          # Install curl and system dependencies
          RUN apt-get update && apt-get install -y --no-install-recommends \
              curl \
              ca-certificates \
              xz-utils \
              && rm -rf /var/lib/apt/lists/*

          # Download and install Obsidian
          ARG OBSIDIAN_VERSION=latest
          RUN if [ "$OBSIDIAN_VERSION" = "latest" ]; then \
                OBSIDIAN_VERSION=$(curl -s https://api.github.com/repos/obsidianmd/obsidian-releases/releases/latest | grep -oP '"tag_name": "\K(.*?)(?=")'); \
              fi && \
              curl -L --output /tmp/obsidian.AppImage "https://github.com/obsidianmd/obsidian-releases/releases/download/${OBSIDIAN_VERSION}/Obsidian-${OBSIDIAN_VERSION#v}.AppImage" && \
              chmod +x /tmp/obsidian.AppImage && \
              mkdir -p /home/kasm-user/.local/bin && \
              cp /tmp/obsidian.AppImage /home/kasm-user/.local/bin/obsidian && \
              chown -R kasm-user:kasm-user /home/kasm-user/.local/bin

          # ---------- Stage 2: Runtime Image ----------
          FROM kasmweb/desktop:1.16.0

          USER root

          # Copy Obsidian from builder
          COPY --from=builder --chown=kasm-user:kasm-user /home/kasm-user/.local/bin /home/kasm-user/.local/bin

          # Set up environment
          ENV PATH="/home/kasm-user/.local/bin:${PATH}"

          # Launch Obsidian on startup
          USER kasm-user
          RUN echo '#!/bin/bash\nobsidian' > /home/kasm-user/.config/autostart/obsidian.desktop && \
              chmod +x /home/kasm-user/.config/autostart/obsidian.desktop

          # Expose ports
          EXPOSE 6901

          CMD ["/dockerstartup.sh"]
          DOCKER_EOF

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Aliyun ACR
        uses: docker/login-action@v4
        with:
          registry: crpi-cir91a122bvjkhqh.cn-shanghai.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Obsidian Remote image
        uses: docker/build-push-action@v7
        with:
          context: obsidian-remote
          push: true
          tags: |
            crpi-cir91a122bvjkhqh.cn-shanghai.personal.cr.aliyuncs.com/${{ secrets.ALIYUN_NAMESPACE }}/obsidian-remote:latest
            crpi-cir91a122bvjkhqh.cn-shanghai.personal.cr.aliyuncs.com/${{ secrets.ALIYUN_NAMESPACE }}/obsidian-remote:${{ github.sha }}
          build-args: |
            OBSIDIAN_VERSION=${{ github.event.inputs.obsidian_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
