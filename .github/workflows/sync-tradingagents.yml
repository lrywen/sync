name: Sync TradingAgents-CN Image to Aliyun ACR

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TradingAgents-CN
        uses: actions/checkout@v5
        with:
          repository: hsliuping/TradingAgents-CN
          ref: main
          fetch-depth: 0

      - name: Create Dockerfile
        run: |
          cat > Dockerfile <<EOF
          FROM python:3.10-slim
          WORKDIR /app
          COPY . .
          RUN pip install --no-cache-dir -r requirements.txt
          CMD ["python", "main.py"]
          EOF

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Aliyun ACR
        uses: docker/login-action@v4
        with:
          registry: crpi-cir91a122bvjkhqh.cn-shanghai.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      # 关键修复：设置 Docker Buildx 以支持缓存导出
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push TradingAgents-CN image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: crpi-cir91a122bvjkhqh.cn-shanghai.personal.cr.aliyuncs.com/${{ secrets.ALIYUN_NAMESPACE }}/tradingagents-cn:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
