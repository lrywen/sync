name: Sync Claw Code Image to Aliyun ACR

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Claw Code
        uses: actions/checkout@v5
        with:
          repository: ultraworkers/claw-code
          ref: main
          fetch-depth: 0

      - name: Create Multi-stage Dockerfile with patch
        run: |
          cat > Dockerfile << 'DOCKER_EOF'
          # ---------- Stage 1: Build the Rust binary ----------
          FROM rust:1.88-slim-bookworm AS builder

          # Install dependencies for building
          RUN apt-get update && apt-get install -y --no-install-recommends \
              pkg-config libssl-dev git \
              && rm -rf /var/lib/apt/lists/*

          WORKDIR /usr/src/claw-code

          # Copy the entire repository
          COPY . .

          # Patch unstable Duration API (now inside the correct WORKDIR)
          RUN find crates -name '*.rs' -exec sed -i 's/Duration::from_hours(\([^)]*\))/Duration::from_secs((\1) * 3600)/g' {} \; && \
              find crates -name '*.rs' -exec sed -i 's/Duration::from_minutes(\([^)]*\))/Duration::from_secs((\1) * 60)/g' {} \;

          # Build the Rust workspace in release mode
          WORKDIR /usr/src/claw-code/rust
          RUN cargo build --release --workspace

          # ---------- Stage 2: Create the runtime image ----------
          FROM debian:bookworm-slim

          # Install runtime dependencies
          RUN apt-get update && apt-get install -y --no-install-recommends \
              ca-certificates libssl3 \
              && rm -rf /var/lib/apt/lists/*

          # Copy the built binary from the builder stage
          COPY --from=builder /usr/src/claw-code/rust/target/release/claw /usr/local/bin/claw

          # Set the entrypoint
          ENTRYPOINT ["/usr/local/bin/claw"]
          DOCKER_EOF

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v4
        with:
          registry: crpi-cir91a122bvjkhqh.cn-shanghai.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Claw Code image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: crpi-cir91a122bvjkhqh.cn-shanghai.personal.cr.aliyuncs.com/${{ secrets.ALIYUN_NAMESPACE }}/claw-code:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
