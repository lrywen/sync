name: Sync Claw Code Image to Aliyun ACR

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Claw Code
        uses: actions/checkout@v5
        with:
          repository: ultraworkers/claw-code
          ref: main
          fetch-depth: 0

      - name: Create Dockerfile with robust patching
        run: |
          cat > Dockerfile << 'DOCKER_EOF'
          # ---------- Stage 1: Build the Rust binary ----------
          FROM rust:1.94-slim-bookworm AS builder

          RUN apt-get update && apt-get install -y --no-install-recommends \
              pkg-config libssl-dev git \
              && rm -rf /var/lib/apt/lists/*

          WORKDIR /usr/src/claw-code
          COPY . .

          # 1. 移除所有 #![feature(...)] 行（特别是 duration_constructors）
          RUN find . -type f -name '*.rs' -exec sed -i '/#!\[feature(/d' {} \;

          # 2. 替换 Duration::from_hours(...) 和 Duration::from_minutes(...)
          RUN find . -type f -name '*.rs' -exec sed -i \
              -e 's/Duration::from_hours(\([^)]*\))/Duration::from_secs((\1) * 3600)/g' \
              -e 's/Duration::from_minutes(\([^)]*\))/Duration::from_secs((\1) * 60)/g' {} \;

          WORKDIR /usr/src/claw-code/rust
          RUN cargo build --release --workspace

          # ---------- Stage 2: Runtime ----------
          FROM debian:bookworm-slim

          RUN apt-get update && apt-get install -y --no-install-recommends \
              ca-certificates libssl3 \
              && rm -rf /var/lib/apt/lists/*

          COPY --from=builder /usr/src/claw-code/rust/target/release/claw /usr/local/bin/claw
          ENTRYPOINT ["/usr/local/bin/claw"]
          DOCKER_EOF

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v4
        with:
          registry: crpi-cir91a122bvjkhqh.cn-shanghai.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Claw Code image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: crpi-cir91a122bvjkhqh.cn-shanghai.personal.cr.aliyuncs.com/${{ secrets.ALIYUN_NAMESPACE }}/claw-code:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
