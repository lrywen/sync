name: Sync OpenCode Official Image to Aliyun ACR

on:
  workflow_dispatch:

jobs:
  sync-opencode:
    runs-on: ubuntu-latest
    steps:
      # 1. 登录 GitHub Container Registry (GHCR)
      #    需要用到你的 GitHub 用户名和 Personal Access Token (PAT)
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      # 2. 登录阿里云 ACR
      - name: Login to Aliyun ACR
        uses: docker/login-action@v4
        with:
          registry: crpi-cir91a122bvjkhqh.cn-shanghai.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      # 3. 拉取官方 opencode 镜像，打标签并推送至阿里云 ACR
      - name: Pull, tag and push OpenCode image
        run: |
          SOURCE_IMAGE="ghcr.io/anomalyco/opencode:latest"
          TARGET_IMAGE="crpi-cir91a122bvjkhqh.cn-shanghai.personal.cr.aliyuncs.com/lrywen/opencode:latest"

          docker pull $SOURCE_IMAGE
          docker tag $SOURCE_IMAGE $TARGET_IMAGE
          docker push $TARGET_IMAGE
